name: Deploy RoomieMatch to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomiematch-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy existing Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-version/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Cloudflare smoke tests
        run: npm test

      - name: Deploy roomiematch-api
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d546b0a6495a8f7c5ee8c9fa306e3513
